<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b5d"><link rel="manifest" href="manifest.json"><title>岩﨑電気工事｜工事写真DX V2.3</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#18232c;font-family:Arial,'Noto Sans JP',sans-serif}header{background:#123b5d;color:#fff;padding:16px;position:sticky;top:0;z-index:5}main{max-width:760px;margin:auto;padding:14px 14px 90px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 5px #0001}h2{font-size:17px;margin:0 0 12px}.muted,.small{font-size:13px;color:#68757d}button{border:0;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:bold;background:#123b5d;color:#fff}button.secondary{background:#e7edf2;color:#123b5d}button.danger{background:#b73535}button.big{width:100%;padding:16px;margin:5px 0}input,select{width:100%;padding:12px;border:1px solid #cbd4da;border-radius:9px;font-size:16px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.task{background:#eef3f7;color:#123b5d;text-align:left;min-height:64px}.task.active{background:#123b5d;color:#fff}.notice{background:#fff7d7;padding:11px;border-left:4px solid #d0a000;border-radius:7px}.ok{background:#eaf7ed;padding:11px;border-left:4px solid #2e8b57;border-radius:7px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10}nav button{flex:1;border-radius:0;background:#fff;color:#5d6971;font-size:12px}.empty{text-align:center;color:#7a858c;padding:25px}</style></head><body>
<header><b>岩﨑電気工事｜工事写真DX V2.3</b><br><small>現場・場所・作業・施工段階を写真に自動紐付け</small></header><main>
<section id="home"><div class="card"><h2>① 現場を登録・選択</h2><div id="jobs"></div><button class="big secondary" onclick="show('new')">＋ 新しい現場を登録</button></div><div class="card"><h2>📊 本日の状況</h2><div id="today"></div></div></section>
<section id="new" class="hidden"><div class="card"><button class="secondary" onclick="home()">← 戻る</button><h2>① 現場を登録</h2><label>工事名</label><input id="jn" placeholder="例：○○ビル電気設備工事"><label>工事番号</label><input id="jno"><label>現場住所</label><input id="ja"><label>担当者</label><input id="jc"><button class="big" onclick="createJob()">現場を登録して次へ</button></div></section>
<section id="job" class="hidden"><div class="card"><button class="secondary" onclick="home()">← 現場一覧</button><h2 id="jt"></h2><div id="ji" class="muted"></div><div class="notice"><b>撮影の流れ</b><br>①現場 → ②場所 → ③作業 → ④施工段階 → ⑤撮影<br><div class="row"><button class="secondary" onclick="document.getElementById('locCard').scrollIntoView({behavior:'smooth'})">② 場所へ</button><button class="secondary" onclick="goTask()">③ 作業へ</button></div></div></div>
<div id="locCard" class="card"><h2>② 場所を選択</h2><p class="muted">階数・部屋名・場所／区画の3項目を登録してください。</p><div id="locations" class="grid"></div><div class="row"><input id="nf" placeholder="階数（例：3階）"><input id="nr" placeholder="部屋名（例：301会議室）"><input id="np" placeholder="場所・区画（例：南側壁面）"><button onclick="addLocation()">追加</button></div><div id="locHint" class="muted"></div></div>
<div id="taskCard" class="card hidden"><h2>③ 作業を選択</h2><div id="selectedPlace" class="ok"></div><div id="tasks" class="grid"></div><div class="row"><input id="nt" placeholder="作業を追加"><button onclick="addTask()">追加</button></div></div>
<div id="capture" class="card hidden"><h2>④ 施工段階 → ⑤ 撮影</h2><div id="summary" class="notice"></div><label>施工段階</label><select id="phase"><option>施工前</option><option>施工中</option><option>施工後</option></select><label>コメント</label><input id="comment"><input id="cam" type="file" accept="image/*" capture="environment" class="hidden" onchange="photo(event)"><button class="big" onclick="cam.click()">📷 この条件で撮影する</button><div id="saved" class="ok hidden"></div><div id="pc" class="muted"></div><div id="pg" class="photos"></div></div><div class="card"><h2>📦 提出</h2><button class="big secondary" onclick="exportJob()">この現場をZIP出力</button></div></section>
<section id="settings" class="hidden"><div class="card"><h2>⚙️ 管理</h2><button class="big secondary" onclick="exportAll()">全現場をZIP出力</button><div id="manageJobs"></div><button class="big danger" onclick="clearData()">⚠️ 全データ削除</button></div></section></main>
<nav><button onclick="home()">🏠<br>現場</button><button onclick="show('settings')">⚙️<br>管理</button></nav><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
const DEFAULT=['01_受変電設備','02_分電盤','03_照明器具','04_コンセント','05_配管','06_配線','07_通信設備','08_火災報知設備'];let db,job=null,loc=null,task=null;const r=indexedDB.open('iwasaki_v2',2);r.onupgradeneeded=e=>{db=e.target.result;if(!db.objectStoreNames.contains('jobs'))db.createObjectStore('jobs',{keyPath:'id'});if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'id',autoIncrement:true})};r.onsuccess=e=>{db=e.target.result;renderJobs();renderToday()};const all=s=>new Promise((a,b)=>{let r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)}),put=(s,o)=>new Promise((a,b)=>{let r=db.transaction(s,'readwrite').objectStore(s).put(o);r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)}),add=(s,o)=>new Promise((a,b)=>{let r=db.transaction(s,'readwrite').objectStore(s).add(o);r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)});function show(id){['home','new','job','settings'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='settings')renderManageJobs()}function home(){job=loc=task=null;show('home');renderJobs();renderToday()}async function renderJobs(){let a=await all('jobs');jobs.innerHTML=a.length?a.map(j=>`<button class="big secondary" onclick="openJob('${j.id}')">📁 ${e(j.name)}<br><small>${e(j.no||'')} ${e(j.address||'')}</small></button>`).join(''):'<div class="empty">現場を登録してください。</div>'}async function renderToday(){let p=await all('photos'),d=fmt(new Date());today.innerHTML='本日の撮影枚数：<b>'+p.filter(x=>fmt(new Date(x.time))===d).length+'枚</b>'}async function createJob(){let n=jn.value.trim();if(!n)return alert('工事名を入力してください');let j={id:'j'+Date.now(),name:n,no: jno.value.trim(),address:ja.value.trim(),contact:jc.value.trim(),tasks:[...DEFAULT],locations:[]};await put('jobs',j);openJob(j.id)}async function openJob(id){job=(await all('jobs')).find(x=>x.id===id);job.locations=job.locations||[];job.tasks=job.tasks||[...DEFAULT];loc=task=null;jt.textContent='📁 '+job.name;ji.textContent=[job.no,job.address,job.contact].filter(Boolean).join(' ｜ ');renderLocations();renderTasks();taskCard.classList.add('hidden');capture.classList.add('hidden');show('job')}function renderLocations(){locations.innerHTML=job.locations.length?job.locations.map(l=>`<button class="task ${loc&&loc.id===l.id?'active':''}" onclick="selectLocation('${l.id}')">📍 ${e(l.floor)}<br><small>${e(l.room)}｜${e(l.place)}</small></button>`).join(''):'<div class="empty" style="grid-column:1/-1">まだ場所がありません。</div>';locHint.textContent=job.locations.length?'場所を選ぶと③作業へ進めます。':'3項目すべて入力してください。'}async function addLocation(){let f=nf.value.trim(),r=nr.value.trim(),p=np.value.trim();if(!f||!r||!p)return alert('階数・部屋名・場所／区画をすべて入力してください。');job.locations.push({id:'l'+Date.now(),floor:f,room:r,place:p});await put('jobs',job);nf.value=nr.value=np.value='';renderLocations()}function goTask(){if(!loc){alert('先に②の場所を選択してください。');locCard.scrollIntoView({behavior:'smooth'});return}taskCard.scrollIntoView({behavior:'smooth'})}function selectLocation(id){loc=job.locations.find(x=>x.id===id);task=null;renderLocations();renderTasks();selectedPlace.innerHTML='<b>選択中：</b>'+e(loc.floor)+'｜'+e(loc.room)+'｜'+e(loc.place);taskCard.classList.remove('hidden');capture.classList.add('hidden')}function renderTasks(){tasks.innerHTML=(job?.tasks||DEFAULT).map(t=>`<button class="task ${task===t?'active':''}" onclick="selectTask('${e(t)}')">${e(t)}</button>`).join('')}async function addTask(){let t=nt.value.trim();if(!t)return;job.tasks.push(t);await put('jobs',job);nt.value='';renderTasks()}async function selectTask(t){if(!loc)return;task=t;summary.innerHTML='<b>この条件で撮影します</b><br>現場：'+e(job.name)+'<br>階数：'+e(loc.floor)+'<br>部屋名：'+e(loc.room)+'<br>場所・区画：'+e(loc.place)+'<br>作業：'+e(t);capture.classList.remove('hidden');capture.scrollIntoView({behavior:'smooth'});await renderPhotos()}async function renderPhotos(){let a=(await all('photos')).filter(p=>p.jobId===job.id&&p.locationId===loc.id&&p.task===task).sort((a,b)=>b.time-a.time);pc.textContent='この条件の撮影済み：'+a.length+'枚';pg.innerHTML=a.map(p=>`<div><img src="${p.data}"><div class="small">${e(p.phase)}</div></div>`).join('')}async function photo(ev){let f=ev.target.files[0];if(!f||!loc||!task)return;let data=await resize(f,1800),d=new Date(),ps=await all('photos'),seq=ps.filter(p=>p.jobId===job.id&&p.locationId===loc.id&&p.task===task).length+1,ph=phase.value,co=comment.value.trim(),fn=fmt(d)+'_'+safe(loc.floor)+'_'+safe(loc.room)+'_'+safe(loc.place)+'_'+safe(task)+'_'+ph+'_'+String(seq).padStart(3,'0')+'.jpg';await add('photos',{jobId:job.id,jobName:job.name,locationId:loc.id,floor:loc.floor,room:loc.room,place:loc.place,task,phase:ph,comment:co,filename:fn,time:Date.now(),data});comment.value='';ev.target.value='';saved.textContent='保存しました：'+loc.floor+'｜'+loc.room+'｜'+loc.place+'｜'+task+'｜'+ph;saved.classList.remove('hidden');renderPhotos();renderToday()}function resize(f,max){return new Promise(ok=>{let im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{let s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.88));URL.revokeObjectURL(u)};im.src=u})}function fmt(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}function safe(s){return String(s).replace(/[\\/:*?"<>|]/g,'_')}function e(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}async function makeZip(js){let ps=await all('photos'),z=new JSZip(),n=0;for(let j of js)for(let p of ps.filter(x=>x.jobId===j.id)){let l=(j.locations||[]).find(x=>x.id===p.locationId),floor=p.floor||l?.floor||'場所未設定',room=p.room||l?.room||'場所未設定',place=p.place||l?.place||'場所未設定';z.folder(safe(j.name)).folder(safe(floor)).folder(safe(room)).folder(safe(place)).folder(safe(p.task||'作業未設定')).folder(safe(p.phase||'施工段階未設定')).file(p.filename,p.data.split(',')[1],{base64:true});n++}if(!n)return alert('写真がありません。');let b=await z.generateAsync({type:'blob'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='岩﨑電気工事_工事写真_'+fmt(new Date())+'.zip';a.click()}async function exportJob(){makeZip([job])}async function exportAll(){makeZip(await all('jobs'))}async function renderManageJobs(){let js=await all('jobs'),ps=await all('photos');manageJobs.innerHTML=js.length?js.map(j=>`<div class="card"><b>📁 ${e(j.name)}</b><br><span class="small">${ps.filter(p=>p.jobId===j.id).length}枚</span><button class="big danger" onclick="deleteJob('${j.id}')">この現場と写真を削除</button></div>`).join(''):'<div class="empty">登録された現場はありません。</div>'}async function deleteJob(id){let j=(await all('jobs')).find(x=>x.id===id);if(!j||!confirm('「'+j.name+'」と写真を削除しますか？'))return;let ps=await all('photos'),ids=ps.filter(p=>p.jobId===id).map(p=>p.id),tx=db.transaction(['jobs','photos'],'readwrite');tx.objectStore('jobs').delete(id);ids.forEach(x=>tx.objectStore('photos').delete(x));tx.oncomplete=()=>{if(job?.id===id)home();else renderManageJobs()}}async function clearData(){if(!confirm('全データを削除しますか？'))return;let tx=db.transaction(['jobs','photos'],'readwrite');tx.objectStore('jobs').clear();tx.objectStore('photos').clear();tx.oncomplete=home}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=23',{updateViaCache:'none'});
</script></body></html>
